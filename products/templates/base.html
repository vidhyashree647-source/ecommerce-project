<!DOCTYPE html>
<html>
<head>
    <title>MyShop</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family: 'Roboto', sans-serif;
            background: #0f172a; /* dark background */
            color: white;
        }

        /* NAVBAR */
        .navbar{
            background: #111827;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
        }

        .logo{
            font-size: 22px;
            font-weight: bold;
            color: #facc15;
        }

        .search-box input{
            width: 400px;
            padding: 8px;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        .cart{
            font-weight: bold;
            color: #38bdf8;
        }

        /* CONTENT */
        .content{
            padding: 20px;
        }

        /* FOOTER */
        .footer{
            background: #111827;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            border-top: 1px solid #1f2937;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">🛍️ MyShop</div>

    <div class="search-box">
        <form method="GET" action="/">
            <input type="text" name="q" placeholder="Search products...">
        </form>
    </div>

    <div class="cart">🛒 Cart</div>
</div>

<div class="content">
    {% block content %}
    {% endblock %}
</div>

<div class="footer">
    © 2026 MyShop | Dark Luxury Theme ✨
</div>

</body>
</html>
