{% extends 'base.html' %}

{% block content %}

<style>
.box{
    background:white;
    padding:20px;
    max-width:600px;
    margin:auto;
    border-radius:10px;
}

.item{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.btn{
    background:#ff9900;
    padding:10px;
    display:inline-block;
    margin-top:15px;
    text-decoration:none;
    color:black;
}
</style>

<div class="box">

<h2>Your Cart 🛒</h2>

{% for item in cart_items %}
<div class="item">
    {{ item.name }} - ₹{{ item.price }}
</div>
{% empty %}
<p>No items in cart</p>
{% endfor %}

<a class="btn" href="/place-order/">Place Order</a>

</div>

{% endblock %}
