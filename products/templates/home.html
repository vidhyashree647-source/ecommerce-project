{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}

<style>
.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    transition:0.2s;
}

.card:hover{
    transform:scale(1.03);
}

.price{
    color:green;
    font-size:18px;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:10px;
    background:#ff9900;
    padding:8px 12px;
    color:black;
    text-decoration:none;
    border-radius:5px;
}
</style>

<h2>🔥 Featured Products</h2>

<div class="product-grid">

{% for product in products %}
<div class="card">
    <h3>{{ product.name }}</h3>
    {% if product.image %}
    <img src="{{ product.image.url }}" width="150" height="150">
{% endif %}
    <p class="price">₹{{ product.price }}</p>
    <a class="btn" href="/product/{{ product.id }}/">View</a>
</div>
{% endfor %}

</div>

{% endblock %}
